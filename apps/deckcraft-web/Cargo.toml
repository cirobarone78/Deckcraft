[package]
name = "deckcraft-web"
description = "DeckCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "deckcraft-web"
path = "src/main.rs"

[features]
# Opt-in, for self-hosted web deployments only (off by default, never in the desktop app): every
# visitor sees a notice when a newer DeckCraft release exists, and the administrator can sign in
# and start the update, which `craft-updated` (craft-libs' craft-update crate) performs on the
# server. Build with `trunk build --release --features self-hosted-update`; setup in
# docs/self-hosted-updates.md. Without it the web app makes no update requests at all.
self-hosted-update = ["dep:craft-update"]

[dependencies]
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "9b85a7c3973b6c799a28553a5376789d33846aa0", optional = true, features = ["egui", "web"] }
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration"] }

[dev-dependencies]
egui_kittest = { workspace = true }
